<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりませんでした｜本格中華 愛華楼</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/styles.css">
<style>
body { background: #0d0d0d; color: #f5f5f5; margin: 0; font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; }
.nf-hero { position: static; border-bottom: none; backdrop-filter: none; background: linear-gradient(135deg, #8b0000 0%, #c41e3a 100%); color: #fff; padding: 0.85rem 1.25rem 1rem; text-align: center; }
.nf-hero .brand { font-size: 1.2rem; font-weight: 700; color: #fff; text-decoration: none; }
.nf-main { max-width: 560px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; text-align: center; }
.nf-main h1 { font-size: 1.25rem; margin: 0 0 1.25rem; color: #fff; line-height: 1.5; }
.nf-main p { font-size: 0.95rem; line-height: 1.9; color: #ddd; margin: 0 0 1rem; }
.nf-buttons { display: grid; gap: 0.75rem; margin-top: 2rem; }
.nf-btn { display: block; padding: 0.95rem 1rem; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 1rem; }
.nf-btn-main { background: #c41e3a; color: #fff; }
.nf-btn-main:hover { background: #a3172f; }
.nf-btn-sub { background: #1a1a1a; color: #f5f5f5; border: 1px solid #333; }
.nf-btn-sub:hover { border-color: #666; }
.nf-footer { text-align: center; padding: 2rem 1rem; color: #666; font-size: 0.85rem; border-top: 1px solid #2a2a2a; }
</style>
</head>
<body>
<header class="nf-hero">
  <a class="brand" href="/">本格中華 愛華楼</a>
</header>
<main class="nf-main">
  <h1>お探しのページは<br>見つかりませんでした</h1>
  <p>催事のご案内ページは、催事が終わると閉じております。<br>ご来場いただいた皆さま、ありがとうございました。</p>
  <p>次の出店予定は、下のボタンからご覧いただけます。</p>
  <div class="nf-buttons">
    <a class="nf-btn nf-btn-main" href="/events/">次の出店予定を見る</a>
    <a class="nf-btn nf-btn-sub" href="/">愛華楼のトップへ</a>
  </div>
</main>
<footer class="nf-footer">本格中華 愛華楼</footer>
</body>
</html>
